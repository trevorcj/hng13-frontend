<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Trevor C. Justus</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
<nav class="main-nav" role="navigation">
      <div class="nav-container">
        <a href="index.html" class="nav-brand">Trevor C. Justus</a>
        <ul class="nav-links">
          <li><a href="index.html">Profile</a></li>
          <li><a href="about.html">About Me</a></li>
          <li><a href="contact.html" aria-current="page">Contact Us</a></li>
        </ul>
        <button
          class="nav-toggle"
          aria-expanded="false"
          aria-controls="nav-links"
          aria-label="Toggle navigation menu">
          ☰
        </button>
      </div>
    </nav>

    <main class="page-content contact-page-container">
      <h1>Contact Us</h1>

      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            data-testid="test-contact-name"
            aria-describedby="error-name"
            required />
          <p
            id="error-name"
            class="error-message"
            data-testid="test-contact-error-name"
            aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            data-testid="test-contact-email"
            aria-describedby="error-email"
            required />
          <p
            id="error-email"
            class="error-message"
            data-testid="test-contact-error-email"
            aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            name="subject"
            data-testid="test-contact-subject"
            aria-describedby="error-subject"
            required />
          <p
            id="error-subject"
            class="error-message"
            data-testid="test-contact-error-subject"
            aria-live="polite"></p>
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            data-testid="test-contact-message"
            aria-describedby="error-message"
            required></textarea>
          <p
            id="error-message"
            class="error-message"
            data-testid="test-contact-error-message"
            aria-live="polite"></p>
        </div>

        <button
          type="submit"
          class="submit-button"
          data-testid="test-contact-submit">
          Send Message
        </button>

        <p
          class="success-message hidden"
          data-testid="test-contact-success"
          aria-live="assertive">
          Thank you for your message! We will get back to you shortly.
        </p>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
